services:
  pg-demo:
    build: .
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      PGUSER: postgres
      PGDATABASE: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./src:/app/src
      - pgdata:/var/lib/postgresql
    stdin_open: true
    tty: true

volumes:
  pgdata:
