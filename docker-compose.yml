services:
  pg-demo:
    build: .
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee_store
      PGUSER: postgres
      PGDATABASE: coffee_store
    ports:
      - "5432:5432"
    volumes:
      - ./src:/app/src
      - pgdata:/var/lib/postgresql
    stdin_open: true
    tty: true

volumes:
  pgdata:
